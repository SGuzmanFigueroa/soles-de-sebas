<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soles de Sebas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soles">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8FAFC">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Fintech claro: fondo gris muy suave, tarjetas blancas, un azul como acción y semánticos solo para estados */
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9;
  --blue:#2563EB; --blue-soft:#EFF4FF; --green:#16A34A; --green-soft:#ECFDF3; --amber:#F59E0B; --amber-ink:#B45309; --amber-soft:#FFF7E6;
  --red:#DC2626; --red-soft:#FEF2F2;
  --r:16px; --r-sm:12px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --font:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
i[data-lucide]{display:inline-flex;width:18px;height:18px}
svg.lucide{width:18px;height:18px;stroke-width:2}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 140px;display:flex;flex-direction:column;gap:12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(248,250,252,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:12px}
.chip-cycle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted)}

h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
h3{margin:0;font-size:14px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tight{padding:12px 14px;gap:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.row > span:first-child{min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:720px){.grid-cats{grid-template-columns:1fr 1fr}}

/* Tarjeta principal */
.hero{background:var(--ink);color:#fff;border:none;border-radius:20px;padding:18px;gap:14px}
.hero .label{color:#94A3B8}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .rows{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.hero .rows .row{font-size:13.5px;color:#CBD5E1}
.hero .rows .row b{color:#fff;font-weight:600}
.hero .today{display:inline-flex;align-items:center;gap:8px;background:rgba(37,99,235,.25);color:#DBEAFE;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;align-self:flex-start}
.hero .today b{color:#fff}
.hero details summary{color:#94A3B8;font-size:12.5px}
.hero .explain{color:#CBD5E1;font-size:12.5px}

details summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--blue)}
details summary::-webkit-details-marker{display:none}
.explain{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:8px}
.explain .row b{color:inherit}

/* Semáforo */
.light{display:flex;gap:12px;align-items:flex-start}
.light .dot{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.light.verde .dot{background:var(--green-soft);color:var(--green)}
.light.amarillo .dot{background:var(--amber-soft);color:var(--amber-ink)}
.light.rojo .dot{background:var(--red-soft);color:var(--red)}
.light.gris .dot{background:var(--soft);color:var(--muted)}
.light p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}

/* Mini tarjetas del día */
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.mini .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mini .v{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mini .s{font-size:11.5px;color:var(--muted)}
.mini .proj{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}

.datebar{display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.iconbtn:disabled{opacity:.35}
.datepick{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;height:36px;font-weight:600;font-size:14px}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}

/* Recomendaciones */
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tip:first-child{border-top:none;padding-top:0}
.tip .ic{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue)}
.tip.alta .ic{background:var(--red-soft);color:var(--red)}
.tip.media .ic{background:var(--amber-soft);color:var(--amber-ink)}
.tip p{margin:0;font-size:14px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-bottom:3px}
.tag.recomendacion{background:var(--blue-soft);color:var(--blue)}
.tag.proyeccion{background:var(--amber-soft);color:var(--amber-ink)}
.tag.estimacion{background:#E2E8F0;color:#0F172A}

/* Barras */
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s ease}
.bar i.ok{background:var(--green)} .bar i.warn{background:var(--amber)} .bar i.bad{background:var(--red)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--amber-soft);color:var(--amber-ink)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.blue{background:var(--blue-soft);color:var(--blue)}

/* Categoría */
.cat{display:flex;flex-direction:column;gap:8px}
.cat .h{display:flex;align-items:center;gap:10px}
.cat .ico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cat .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cat .nums b{color:var(--ink);font-weight:600}

/* Movimientos */
.mov{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.mov:first-child{border-top:none}
.mov .ico{flex:none;width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.mov .t{flex:1;min-width:0}
.mov .t b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .a{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.mov .a small{display:block;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mov .a.in{color:var(--green)}
.daygrp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;padding-top:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.danger.on{background:var(--red);border-color:var(--red)}
.seg{display:flex;background:#EEF2F6;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);min-height:36px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;height:42px;color:var(--muted)}
.search input{border:none;outline:none;background:none;flex:1;min-width:0;color:var(--ink)}

.kpi{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:18px;font-weight:700;letter-spacing:-.01em}
.kpi .v.pos{color:var(--green)} .kpi .v.neg{color:var(--red)}

.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--blue);color:#fff;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--red)}
.btn.sm{min-height:36px;padding:8px 12px;font-size:13px}
.link{border:none;background:none;color:var(--blue);font-weight:600;font-size:13px;padding:6px 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#CBD5E1;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + span{background:var(--blue)}
.switch input:checked + span::after{transform:translateX(18px)}

.field{display:flex;flex-direction:column;gap:6px}
.input,.field input,.field select,.field textarea{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);width:100%;min-height:44px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.line:first-child{border-top:none}
.line small{display:block;color:var(--muted);font-size:12px}
.line input{width:110px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:2px solid var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:18px 8px}
.empty .ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted)}

.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tipline{font-size:12.5px;color:var(--muted);min-height:18px}

/* Navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;padding:9px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--blue)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:none;background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(37,99,235,.35);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* Hojas que suben */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;background:var(--card);border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;transition:transform .2s ease}
.grab{flex:none;width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--blue);padding-bottom:4px}
.amt span{font-size:26px;font-weight:700;color:var(--muted)}
.amt input{border:none;background:none;font-weight:800;font-size:40px;width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion: no-preference){.view-in{animation:fade .18s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view" class="stack" style="gap:12px"><div class="card empty">Cargando tu plan…</div></main>
</div>

<button class="fab" id="fab" aria-label="Registrar movimiento"><i data-lucide="plus"></i></button>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-v="inicio"><i data-lucide="home"></i>Inicio</button>
    <button data-v="movimientos"><i data-lucide="receipt"></i>Movimientos</button>
    <button data-v="presupuesto"><i data-lucide="pie-chart"></i>Presupuesto</button>
    <button data-v="objetivos"><i data-lucide="target"></i>Objetivos</button>
    <button data-v="finanzas"><i data-lucide="bar-chart-3"></i>Finanzas</button>
  </div>
</nav>

<div class="sheet-bg" id="sheet" hidden><form class="sheet" id="sheet-form" autocomplete="off"><div class="grab" aria-hidden="true"></div><div id="sheet-body" class="stack" style="gap:14px"></div></form></div>
<div class="sheet-bg" id="cierre" hidden><form class="sheet" id="cierre-form" autocomplete="off"><div class="grab" aria-hidden="true"></div><div id="cierre-body" class="stack" style="gap:14px"></div></form></div>
<div class="sheet-bg" id="dlg" hidden><form class="sheet" id="dlg-form" autocomplete="off"><div class="grab" aria-hidden="true"></div><div id="dlg-body" class="stack" style="gap:14px"></div></form></div>

<script>window.APP_VERSION = '1793201273812';</script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="calc.js?v=1793201273812"></script>
<script src="app.js?v=1793201273812"></script>
</body>
</html>
