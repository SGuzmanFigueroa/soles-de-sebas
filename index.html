<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soles de Sebas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soles">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0D6A4E">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app de bolsillo; pestañas fijas abajo y botón flotante para registrar un gasto en dos toques */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --soft:#E1E8E4; --ink:#12201A; --muted:#5A6A63; --line:#D3DCD7;
  --accent:#0D6A4E; --accent-ink:#FFFFFF; --gold:#9A6A14; --ok:#1E8448; --warn:#A86400; --bad:#BF3328;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#151F1B; --soft:#1C2924; --ink:#E4EDE8; --muted:#90A29A; --line:#26342E;
    --accent:#3DBE8C; --accent-ink:#04110C; --gold:#DDAA48; --ok:#4BC387; --warn:#E6A43C; --bad:#F2695D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1B; --soft:#1C2924; --ink:#E4EDE8; --muted:#90A29A; --line:#26342E;
  --accent:#3DBE8C; --accent-ink:#04110C; --gold:#DDAA48; --ok:#4BC387; --warn:#E6A43C; --bad:#F2695D; color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 140px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}

.cyc{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cyc button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.cyc .mid{text-align:center;min-width:0}
.cyc .mid b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600}

h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:var(--accent);color:var(--accent-ink);border:none}
.hero .label{color:inherit}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}
.hero .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar i{background:var(--accent-ink)}
.hero.neg{background:var(--bad);color:var(--accent-ink)}

.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.gold{background:var(--gold)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}

.cat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.cat .bar{grid-column:1/-1}
.cat .v{font-size:13px;color:var(--muted)}
.cat .v b{color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:14px}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--soft)}
.alert::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--accent)}
.alert.warn::before{background:var(--warn)} .alert.bad::before{background:var(--bad)}
.alerts{display:flex;flex-direction:column;gap:8px}

.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mov{display:flex;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.mov:first-child{border-top:none}
.mov .t{flex:1;min-width:0}
.mov .t b{font-weight:600}
.mov .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .a{font-weight:600}
.x{border:none;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.x.sure{background:var(--bad);color:var(--accent-ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.pago{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.pago:first-of-type{border-top:none}
.pago .d{text-align:center;line-height:1.1}
.pago .d b{display:block;font-family:var(--f-display);font-size:20px}
.pago .d small{font-size:11px;color:var(--muted);text-transform:uppercase}
.pago .t{min-width:0}
.pago .t small{display:block;color:var(--muted);font-size:12px}
.pago.done .t b{text-decoration:line-through;color:var(--muted)}
.chk{display:flex;align-items:center;gap:6px}
.chk input{width:84px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chk button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chk button.on{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}

ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps li::marker{font-weight:700;color:var(--accent)}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

.grp{display:flex;flex-direction:column;gap:2px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.line:first-child{border-top:none}
.line small{display:block;color:var(--muted);font-size:12px}
.line input{width:96px;text-align:right;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:8px;border-top:2px solid var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.acct{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.acct .dot{width:12px;height:12px;border-radius:4px;margin-top:4px}

.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22)}

.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(5,12,9,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;transition:transform .2s ease}
.grab{flex:none;width:44px;height:5px;border-radius:99px;background:var(--line);margin:-6px auto 0}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.daychips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.daychips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px;text-align:center;line-height:1.2}
.daychips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daychips button small{display:block;font-weight:500;font-size:11px;opacity:.8}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.amt span{font-family:var(--f-display);font-size:28px;color:var(--muted)}
.amt input{border:none;background:none;font-family:var(--f-display);font-weight:800;font-size:44px;width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.cred.on{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;color:var(--muted);padding-block:28px}
.chart svg{width:100%;height:auto;display:block}
.meta-big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta-big b{font-family:var(--f-display);font-size:26px;font-weight:800}
.meta-big span{color:var(--muted);font-size:13px}
.pend{display:flex;gap:10px;align-items:flex-start;padding-block:6px}
.pend input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.pend.ok span{text-decoration:line-through;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .bar i{transition:width .4s ease} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="brand">Soles <span>de Sebas</span></div>
      <div class="sub" id="status">Cargando tu plan…</div>
    </div>
  </header>
  <main id="view">
    <div class="card empty">Cargando tu plan y tus movimientos…</div>
  </main>
</div>

<button class="fab" id="fab" aria-label="Registrar gasto">+</button>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-v="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/></svg>Hoy</button>
    <button data-v="pagos"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4M8.5 14.5l2 2 4-4"/></svg>Pagos</button>
    <button data-v="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>Metas</button>
    <button data-v="reporte"><svg viewBox="0 0 24 24"><path d="M5 20V10M10 20V5M15 20v-7M20 20v-11"/></svg>Reporte</button>
    <button data-v="plan"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg>Plan</button>
  </div>
</nav>

<div class="sheet-bg" id="sheet" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <div class="row2"><h2>Registrar gasto</h2><button type="button" class="x" id="close">Cerrar</button></div>
    <label class="amt"><span>S/</span><input id="f-monto" inputmode="decimal" placeholder="0.00" aria-label="Monto"></label>
    <div class="field"><span class="label">¿En qué?</span><div class="chips" id="f-cats"></div></div>
    <div class="field"><span class="label">¿Con qué pagaste?</span><div class="chips" id="f-medios"></div></div>
    <div class="two">
      <label class="field"><span class="label">Fecha</span><input type="date" id="f-fecha"></label>
      <label class="field"><span class="label">Nota</span><input id="f-nota" placeholder="Opcional"></label>
    </div>
    <div id="f-warn"></div>
    <button class="btn" type="submit" id="f-save">Guardar gasto</button>
  </form>
</div>

<div class="sheet-bg" id="cierre" hidden>
  <form class="sheet" id="cierre-form" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <div class="row2"><h2>Finalizar día</h2><button type="button" class="x" id="cierre-close">Cerrar</button></div>
    <div id="cierre-body" style="display:flex;flex-direction:column;gap:14px"></div>
    <button class="btn" type="submit">Guardar cierre</button>
  </form>
</div>

<script>
const CATS = {
  mama:{n:'Mamá (deuda)',g:'fijo'}, telefono:{n:'Teléfono',g:'fijo'}, tc_bbva:{n:'Tarjeta BBVA',g:'fijo'}, tc_bcp:{n:'Tarjeta BCP',g:'fijo'},
  caja:{n:'Caja Arequipa',g:'fijo'}, adelanto:{n:'Adelanto de sueldo',g:'fijo',h:'S/ 500 + S/ 20 de comisión'}, suscripciones:{n:'Suscripciones',g:'fijo',h:'Spotify, Claude, Workspace (pago TC BBVA)'}, casa:{n:'Aporte casa',g:'fijo'}, soat:{n:'SOAT moto',g:'fijo'},
  gasolina:{n:'Gasolina',g:'moto'}, moto_fondo:{n:'Fondo moto',g:'moto',h:'Mantenimiento y SOAT del próximo año'},
  emergencia:{n:'Emergencia',g:'ahorro'}, brasil:{n:'Viaje a Brasil',g:'ahorro'}, inversion:{n:'Inversión',g:'ahorro'},
  novia:{n:'Novia',g:'libre',h:'Salidas y regalos'}, comida:{n:'Comida fuera',g:'libre'}, ropa:{n:'Ropa y gustos',g:'libre'},
  regalos:{n:'Fechas especiales',g:'libre',h:'Cumpleaños, Navidad'}, varios:{n:'Varios',g:'libre',h:'Pasajes, farmacia, imprevistos'}
};
const GRUPOS = [
  ['fijo','Pagos fijos','Se quedan en Interbank'],
  ['moto','Moto','Interbank'],
  ['ahorro','Ahorro','Se va a BBVA el día de pago'],
  ['libre','Gastos libres','Llegan a BCP/Yape cada lunes']
];
const QUICK = ['comida','novia','gasolina','ropa','regalos','varios'];
const MEDIOS = [['yape','Yape (BCP)'],['debito','Débito BCP'],['debito_ib','Débito Interbank'],['efectivo','Efectivo'],['plin','Plin'],['adelanto','Adelanto de sueldo'],['tc_bbva','Tarjeta BBVA'],['tc_bcp','Tarjeta BCP'],['credito','Crédito']];
const MEDIOS_NUEVOS = MEDIOS.filter(x => x[0] !== 'credito');
const isCred = k => k === 'credito' || String(k || '').startsWith('tc_');
// Dónde está la plata: se pregunta al finalizar el día
const CUENTAS = [
  {k:'bcp', n:'BCP + Yape', h:'Tu semanal'}, {k:'interbank', n:'Interbank', h:'Pagos del mes'},
  {k:'bbva', n:'BBVA ahorro', h:'Emergencia, Brasil, inversión'}, {k:'efectivo', n:'Efectivo', h:'Lo que tienes en la billetera'},
  {k:'tc_bbva', n:'Tarjeta BBVA', tipo:'tc'}, {k:'tc_bcp', n:'Tarjeta BCP', tipo:'tc'}
];
const lineas = () => ({tc_bbva: 500, tc_bcp: 500, ...((state.config && state.config.lineas) || {})});
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];

const state = {config:null, movs:[], cierres:[], loadedCfg:false, loadedMovs:false, view:'hoy', off:0, wk:0, scope:'ciclo', db:null, sel:{cat:'comida', medio:'yape'}};
try { const v = localStorage.getItem('soles.view'); if (v) state.view = v; } catch(e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const money = n => 'S/ ' + (Math.round((+n||0)*100)/100).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => 'S/ ' + Math.round(+n||0).toLocaleString('es-PE');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const daysBetween = (a,b) => Math.round((b-a)/864e5);
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const short = d => `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
const longD = d => `${DOW[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const sum = arr => arr.reduce((s,m) => s + (+m.monto||0), 0);

const dia = () => state.config?.diaInicio || 28;
function cycleIdOf(d){ let y = d.getFullYear(), m = d.getMonth(); if (d.getDate() < dia()) { m--; if (m < 0) { m = 11; y--; } } return `${y}-${pad(m+1)}`; }
function shiftCycle(id,k){ const [y,m] = id.split('-').map(Number); const d = new Date(y, m-1+k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function cycleRange(id){ const [y,m] = id.split('-').map(Number); return {start:new Date(y,m-1,dia()), end:new Date(y,m,dia()-1)}; }
function cycleName(id){ const r = cycleRange(id); return cap(MESES[r.end.getMonth()]) + ' ' + r.end.getFullYear(); }
function baseCycle(){ let id = cycleIdOf(today()); const ini = state.config?.inicio; if (ini && id < ini) id = ini; return id; }
const viewCycle = () => shiftCycle(baseCycle(), state.off);
// Lo gastado antes de que arranque el plan cuenta en el primer mes
const movsIn = (r) => { const ini = state.config && state.config.inicio, a = ini && ymd(r.start) === ymd(cycleRange(ini).start) ? '0000-00-00' : ymd(r.start), b = ymd(r.end); return state.movs.filter(m => m.fecha >= a && m.fecha <= b); };

// soloBase: el mes "normal", sin los montos propios de ese mes
function planFor(id, soloBase){
  const c = state.config, ov = soloBase ? {} : (c.ciclos||{})[id] || {};
  const montos = {...(c.base?.montos||{}), ...(ov.montos||{})};
  for (const t of (c.traslados||[])) if (id > t.hasta && +montos[t.cat]) { montos[t.a] = (+montos[t.a]||0) + (+montos[t.cat]); montos[t.cat] = 0; }
  const ingreso = ov.ingreso ?? c.base?.ingreso ?? 0;
  const extras = ov.extras || [];
  const totalIngreso = ingreso + extras.reduce((s,e) => s + (+e.monto||0), 0);
  const byGroup = {fijo:0, moto:0, ahorro:0, libre:0};
  for (const k in montos) { const g = CATS[k]?.g; if (g) byGroup[g] += (+montos[k]||0); }
  const asignado = byGroup.fijo + byGroup.moto + byGroup.ahorro + byGroup.libre;
  return {id, montos, ingreso, extras, totalIngreso, byGroup, asignado, colchon: totalIngreso - asignado, nota: ov.nota || '', repartir: !!ov.repartirSobrante, hasOv: ov.montos || {}};
}

function libreStatus(p, r, t, gastos){
  const budget = p.byGroup.libre;
  const total = daysBetween(r.start, r.end) + 1;
  const tt = t < r.start ? r.start : (t > r.end ? r.end : t);
  let we = addDays(tt, (7 - tt.getDay()) % 7); if (we > r.end) we = r.end;
  const libres = gastos.filter(m => CATS[m.cat]?.g === 'libre');
  const gastado = sum(libres);
  const hastaDom = budget * (daysBetween(r.start, we) + 1) / total;
  const ritmo = budget * (daysBetween(r.start, tt) + 1) / total;
  return {budget, gastado, disponible: hastaDom - gastado, we, ritmo, semanal: budget * 7 / total};
}

function pagoItems(id){
  const p = planFor(id), r = cycleRange(id), dias = state.config.dias || {};
  return Object.keys(p.montos)
    .filter(k => CATS[k] && (CATS[k].g === 'fijo' || CATS[k].g === 'ahorro' || k === 'moto_fondo') && +p.montos[k] > 0)
    .map(k => {
      const dd = (CATS[k].g === 'ahorro' || k === 'moto_fondo') ? dia() : dias[k];
      let fecha = null;
      if (dd) fecha = dd >= dia() ? new Date(r.start.getFullYear(), r.start.getMonth(), dd) : new Date(r.end.getFullYear(), r.end.getMonth(), dd);
      const mid = `p-${id}-${k}`;
      return {k, monto: +p.montos[k], fecha, mid, done: state.movs.find(m => m.id === mid)};
    })
    .sort((a,b) => (a.fecha ? a.fecha.getTime() : 9e15) - (b.fecha ? b.fecha.getTime() : 9e15));
}

let queue = Promise.resolve();
function write(fn, ok){
  queue = queue.then(fn).then(() => { if (ok) toast(ok); }).catch(e => {
    toast(e?.code === 'quota_exceeded' ? 'No hay espacio para más registros.' : 'No se pudo guardar. Revisa tu conexión e intenta otra vez.');
  });
  return queue;
}

function toast(msg){
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }

function vHoy(){
  const id = viewCycle(), r = cycleRange(id), p = planFor(id), t = today();
  const pre = t < r.start, past = t > r.end;
  const ms = movsIn(r), gastos = ms.filter(m => m.tipo === 'gasto');
  const ls = libreStatus(p, r, t, gastos);
  const nextPay = addDays(r.end, 1);
  const spent = {}; for (const m of ms) spent[m.cat] = (spent[m.cat]||0) + (+m.monto||0);

  const alerts = [];
  if (pre) alerts.push(['', `Tu plan arranca el <b>${longD(r.start)}</b>, día de pago. Faltan ${daysBetween(t, r.start)} días.`]);
  if (p.colchon < -0.5) alerts.push(['bad', `Este mes el plan gasta ${money(-p.colchon)} más de lo que entra. Anota tu liquidación en <b>Plan</b> para cubrirlo.`]);

    const b = +p.montos[k]||0, s = spent[k]||0;
    if (b > 0 && s > b) alerts.push(['bad', `Te pasaste en ${CATS[k].n}: ${money(s)} de ${money(b)}.`]);
    else if (b > 0 && s >= b * .8) alerts.push(['warn', `${CATS[k].n} va en ${Math.round(s/b*100)}% del mes.`]);
    else if (b === 0 && s > 0) alerts.push(['warn', `${CATS[k].n} no tenía presupuesto este mes y ya va ${money(s)}.`]);
  }
  const cred = gastos.filter(m => isCred(m.medio));
  if (cred.length) alerts.push(['bad', `Usaste la tarjeta de crédito ${cred.length} ${cred.length === 1 ? 'vez' : 'veces'} (${money(sum(cred))}). La regla: crédito solo para suscripciones.`]);
  if (!pre && !past && ls.gastado > ls.ritmo * 1.1 && ls.gastado > 20) alerts.push(['warn', `Vas más rápido de lo planeado: llevas ${money(ls.gastado)} y lo ideal a hoy era ${money(ls.ritmo)}.`]);

    const d = daysBetween(t, it.fecha);
    if (d < 0 && !pre) alerts.push(['bad', `${CATS[it.k].n} venció el ${short(it.fecha)} y no está marcado como pagado.`]);
    else if (d >= 0 && d <= 3 && !pre) alerts.push(['warn', `${CATS[it.k].n}: ${money(it.monto)} ${d === 0 ? 'vence hoy' : 'vence el ' + longD(it.fecha)}.`]);

  const neg = ls.disponible < 0;
  const hero = `<section class="card hero ${neg ? 'neg' : ''}">
    <span class="label">${pre ? 'Tu semanal será' : neg ? 'Te pasaste esta semana' : 'Puedes gastar hasta el ' + longD(ls.we)}</span>
    <div class="big num">${pre ? money0(ls.semanal) : money(Math.abs(ls.disponible))}</div>
    ${barHTML(ls.gastado, ls.budget, ls.budget ? `<span class="tick" style="left:${Math.min(100, ls.ritmo/ls.budget*100)}%"></span>` : '')}
    <div class="row"><span class="num">Libres del mes: ${money(ls.gastado)} de ${money0(ls.budget)}</span><span>${past ? 'Mes cerrado' : `Pago en ${daysBetween(t, nextPay)} días · ${short(nextPay)}`}</span></div>
  </section>`;

  const cats = [...QUICK].filter(k => (+p.montos[k]||0) > 0 || spent[k]);
  const catsHTML = cats.map(k => `<div class="cat"><b>${CATS[k].n}</b><span class="v num"><b>${money(spent[k]||0)}</b> / ${money0(p.montos[k]||0)}</span>${barHTML(spent[k]||0, +p.montos[k]||0)}</div>`).join('');

  const prox = pagoItems(id).filter(i => !i.done).slice(0, 3);

function vReporteMes(){
  const id = shiftCycle(baseCycle(), state.mo || 0), r = cycleRange(id), p = planFor(id), t = today();
  const ms = movsIn(r), gastos = ms.filter(m => m.tipo === 'gasto');
  const libres = gastos.filter(m => CATS[m.cat]?.g === 'libre'), totalLibre = sum(libres);
  const pagos = sum(ms.filter(m => m.tipo === 'pago')), ahorro = sum(ms.filter(m => m.tipo === 'ahorro'));
  const planPagos = p.byGroup.fijo + (+p.montos.moto_fondo || 0), planAhorro = p.byGroup.ahorro;
  const totalDias = daysBetween(r.start, r.end) + 1;
  const hasta = t < r.start ? r.start : t > r.end ? r.end : t, transcurridos = t < r.start ? 0 : daysBetween(r.start, hasta) + 1;
  const ritmo = p.byGroup.libre * transcurridos / totalDias;
  const verdict = transcurridos === 0 ? ['', 'Aún no empieza'] : totalLibre <= ritmo ? ['ok', 'Vas bien'] : totalLibre <= ritmo * 1.15 ? ['warn', 'Cuidado'] : ['bad', 'Vas pasado'];
  const byCat = {}; for (const m of gastos) byCat[m.cat] = (byCat[m.cat]||0) + (+m.monto||0);
  const byMed = {}; for (const m of gastos) byMed[m.medio] = (byMed[m.medio]||0) + (+m.monto||0);
  const days = [...Array(totalDias)].map((_,i) => { const d = addDays(r.start, i); return {d, v: sum(gastos.filter(m => m.fecha === ymd(d)))}; });
  const daily = p.byGroup.libre / totalDias, max = Math.max(daily, ...days.map(x => x.v)) * 1.15 || 1;
  const W = 340, H = 150, top = 14, bot = 22, slot = W / totalDias, bw = Math.max(3, slot - 3), y = v => top + (H - top - bot) * (1 - v/max);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por día del mes">

      ${i % 7 === 0 ? `<text x="${X + bw/2}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.d.getDate()} ${MESES[x.d.getMonth()].slice(0,3)}</text>` : ''}`; }).join('')}

  const semanal = p.byGroup.libre * 7 / totalDias;

  const cred = gastos.filter(m => isCred(m.medio));

    <section class="card"><div class="row2"><span class="label">Gastos libres del mes</span><span class="pill ${verdict[0]}">${verdict[1]}</span></div>
      <div class="meta-big"><b class="num">${money(totalLibre)}</b><span class="num">de ${money0(p.byGroup.libre)}</span></div>

function vReporteSemana(){
  const w = weekRange(), t = today();
  const cid = cycleIdOf(w.end < cycleRange(baseCycle()).start ? cycleRange(baseCycle()).start : w.start);
  const p = planFor(cid), r = cycleRange(cid);
  const semanal = libreStatus(p, r, t, []).semanal;
  const a = ymd(w.start), b = ymd(w.end);
  const ms = state.movs.filter(m => m.tipo === 'gasto' && m.fecha >= a && m.fecha <= b);
  const libres = ms.filter(m => CATS[m.cat]?.g === 'libre'), total = sum(libres);
  const pct = semanal ? total / semanal : 0;
  const verdict = total <= semanal ? ['ok','Vas bien'] : total <= semanal * 1.2 ? ['warn','Cuidado'] : ['bad','Te pasaste'];
  const byCat = {}; for (const m of ms) byCat[m.cat] = (byCat[m.cat]||0) + (+m.monto||0);
  const byMed = {}; for (const m of ms) byMed[m.medio] = (byMed[m.medio]||0) + (+m.monto||0);
  const days = [...Array(7)].map((_,i) => { const d = addDays(w.start, i); return {d, v: sum(ms.filter(m => m.fecha === ymd(d)))}; });
  const daily = semanal / 7, max = Math.max(daily, ...days.map(x => x.v)) * 1.15 || 1;
  const W = 340, H = 150, top = 14, bot = 24, bw = 30, gap = (W - 7*bw) / 8, y = v => top + (H - top - bot) * (1 - v/max);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por día de la semana">
    <line x1="0" x2="${W}" y1="${y(daily)}" y2="${y(daily)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${W}" y="${y(daily) - 4}" text-anchor="end" font-size="10" fill="var(--muted)">ideal ${money0(daily)}/día</text>
    ${days.map((x,i) => { const X = gap + i*(bw+gap), Y = y(x.v); return `<rect x="${X}" y="${Y}" width="${bw}" height="${Math.max(0, H - bot - Y)}" rx="5" fill="${x.v > daily ? 'var(--warn)' : 'var(--accent)'}"/>
      <text x="${X + bw/2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${DOW[x.d.getDay()]}</text>
      ${x.v > 0 ? `<text x="${X + bw/2}" y="${Y - 4}" text-anchor="middle" font-size="10" fill="var(--ink)">${Math.round(x.v)}</text>` : ''}`; }).join('')}
  </svg>`;
  const cred = ms.filter(m => isCred(m.medio));
  const top5 = [...ms].sort((a,b) => b.monto - a.monto).slice(0, 5);
  const txt = [
    `Reporte ${short(w.start)} – ${short(w.end)}`,
    `Gastos libres: ${money(total)} de ${money(semanal)} semanal (${Math.round(pct*100)}%) → ${verdict[1]}`,
    ...Object.entries(byCat).sort((a,b) => b[1]-a[1]).map(([k,v]) => `· ${CATS[k]?.n || k}: ${money(v)}`),
    `Tarjeta de crédito: ${cred.length} usos${cred.length ? ' (' + money(sum(cred)) + ')' : ''}`,
    `Próximo pago: ${short(addDays(cycleRange(baseCycle()).end, 1))}`
  ].join('\n');
  return `<div class="cyc"><button data-act="wk" data-k="-1" aria-label="Semana anterior">‹</button>
      <div class="mid"><b>${state.wk === 0 ? 'Esta semana' : state.wk === -1 ? 'Semana pasada' : 'Semana del ' + short(w.start)}</b><span class="sub">${longD(w.start)} – ${longD(w.end)}</span></div>
      <button data-act="wk" data-k="1" aria-label="Semana siguiente" ${state.wk >= 0 ? 'disabled' : ''}>›</button></div>
    <section class="card"><div class="row2"><span class="label">Gastos libres de la semana</span><span class="pill ${verdict[0]}">${verdict[1]}</span></div>
      <div class="meta-big"><b class="num">${money(total)}</b><span class="num">de ${money0(semanal)} semanal</span></div>
      ${barHTML(total, semanal)}
      <div class="chart">${svg}</div></section>
    <section class="card"><h2>Por categoría</h2>${Object.keys(byCat).length ? Object.entries(byCat).sort((a,b) => b[1]-a[1]).map(([k,v]) => `<div class="row2"><span>${CATS[k]?.n || esc(k)}</span><b class="num">${money(v)}</b></div>`).join('') : '<div class="sub">Sin gastos registrados en esta semana.</div>'}</section>
    <section class="card"><h2>Con qué pagaste</h2>${Object.keys(byMed).length ? Object.entries(byMed).map(([k,v]) => `<div class="row2"><span>${MEDIOS.find(x => x[0] === k)?.[1] || esc(k)} ${isCred(k) ? '<span class="pill bad">fuera de la regla</span>' : ''}</span><b class="num">${money(v)}</b></div>`).join('') : '<div class="sub">—</div>'}</section>
    ${top5.length ? `<section class="card"><h2>Gastos más grandes</h2><div>${top5.map(movRow).join('')}</div></section>` : ''}
    <section class="card"><h2>Resumen para copiar</h2><pre id="rep-txt" style="white-space:pre-wrap;margin:0;font:inherit;font-size:14px">${esc(txt)}</pre><button class="btn ghost" data-act="copy">Copiar resumen</button></section>`;
}

      <div class="sub">${base ? 'Así queda un mes normal con el sueldo nuevo. Los meses con montos propios, como noviembre, se revisan en la otra pestaña.' : `Montos de ${cycleName(id).split(' ')[0].toLowerCase()}, con sus pagos especiales.`}</div>

      <div class="sub">${p.colchon >= 0 ? 'El colchón se queda en Interbank para imprevistos. El día 27, lo que no usaste pásalo a Emergencia.' : 'El plan gasta más de lo que entra este mes.'}</div>

function render(){
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && $('#view').contains(ae)) return;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  const v = $('#view');
  if (!state.db) { v.innerHTML = `<div class="card empty">Este navegador no deja guardar datos. Sal del modo privado de Safari e inténtalo otra vez.</div>`; $('#status').textContent = 'No se pueden guardar datos'; return; }
  if (!state.loadedCfg || !state.loadedMovs) return;
  if (!state.config) { v.innerHTML = `<div class="card empty"><h2>Tu plan todavía no está cargado</h2><p>Copia el link que te mandó Claude y pégalo aquí abajo. Es una sola vez: después tu plan se actualiza solo.</p>${pastePlanHTML('cfg0')}<p class="sub">O si tienes un respaldo:</p><label class="btn ghost" style="display:inline-block">Restaurar respaldo<input type="file" id="restore0" data-act="restore" accept="application/json,.json" hidden></label></div>`; return; }
  const id = baseCycle(), r = cycleRange(id), t = today();
  $('#status').textContent = t < r.start ? `Arranca el ${longD(r.start)}` : `${cycleName(id)} · día ${daysBetween(r.start, t) + 1} de ${daysBetween(r.start, r.end) + 1}`;
  v.style.display = 'flex'; v.style.flexDirection = 'column'; v.style.gap = '14px';
  v.innerHTML = ({hoy: vHoy, pagos: vPagos, metas: vMetas, reporte: vReporte, plan: vPlan}[state.view] || vHoy)();
}

/* ---------- interacción ---------- */
document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.view = b.dataset.v; try { localStorage.setItem('soles.view', state.view); } catch(e) {}
  render(); window.scrollTo(0, 0);
});

let delArmed = null;
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  const act = b.dataset.act;
  if (act === 'cyc') { state.off += +b.dataset.k; render(); }
  else if (act === 'wk') { state.wk = Math.min(0, state.wk + +b.dataset.k); render(); }
  else if (act === 'day') { const k = +b.dataset.k; state.dayOff = k === 0 ? 0 : Math.min(0, (state.dayOff || 0) + k); render(); }
  else if (act === 'rmode') { state.rmode = b.dataset.m; render(); }
  else if (act === 'mo') { state.mo = Math.min(0, (state.mo || 0) + +b.dataset.k); render(); }
  else if (act === 'go') { state.view = b.dataset.v; render(); window.scrollTo(0,0); }
  else if (act === 'scope') { state.scope = b.dataset.s; render(); }
  else if (act === 'del') {
    if (delArmed !== b.dataset.id) { delArmed = b.dataset.id; b.textContent = '¿Borrar?'; b.classList.add('sure'); setTimeout(() => { if (delArmed === b.dataset.id) { delArmed = null; render(); } }, 3000); return; }
    delArmed = null; const id = b.dataset.id;
    write(() => state.db.collection('movs').doc(id).delete(), 'Gasto borrado');
  }
  else if (act === 'pago') {
    const id = viewCycle(), it = pagoItems(id).find(i => i.k === b.dataset.k); if (!it) return;
    if (it.done) { write(() => state.db.collection('movs').doc(it.mid).delete(), 'Desmarcado'); return; }
    const r = cycleRange(id), t = today(), f = t < r.start ? r.start : t > r.end ? r.end : t;
    const monto = num($('#pg-' + it.k)?.value ?? it.monto);
    write(() => state.db.collection('movs').doc(it.mid).set({tipo: CATS[it.k].g === 'ahorro' ? 'ahorro' : 'pago', cat: it.k, monto, fecha: ymd(f), medio: 'transferencia', nota: '', ciclo: id, creado: Date.now()}), `${CATS[it.k].n} marcado`);
  }
  else if (act === 'meta') {
    const k = $('#mt-k').value, m = num($('#mt-m').value) * +b.dataset.s;
    if (!m) { toast('Escribe un monto.'); return; }
    write(() => state.db.collection('movs').add({tipo: 'ahorro', cat: k, monto: m, fecha: ymd(today()), medio: 'transferencia', nota: m > 0 ? 'Aporte extra' : 'Retiro', creado: Date.now()}), m > 0 ? 'Aporte guardado' : 'Retiro guardado');
  }
  else if (act === 'repartir') {
    const id = viewCycle();
    write(() => cfgRef().update({ciclos: {[id]: {montos: {brasil: +b.dataset.b, emergencia: +b.dataset.e}}}}), 'Reparto aplicado');
  }
  else if (act === 'loadcfg') {
    const ta = $('#' + b.dataset.src);
    if (ta) ta.blur();
    const had = !!state.config;
    if (await loadFromText((ta && ta.value) || state.pasteBuf)) { state.pasteBuf = ''; toast(had ? 'Plan actualizado' : 'Plan cargado'); render(); window.scrollTo(0, 0); }
    else toast('Ese link no está completo. Cópialo otra vez entero.');
  }
  else if (act === 'cierre') openCierre(b.dataset.f);
  else if (act === 'backup') {
    const blob = new Blob([JSON.stringify({app: 'soles-de-sebas', v: 1, fecha: new Date().toISOString(), config: state.config, movs: state.movs, cierres: state.cierres}, null, 2)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'soles-respaldo-' + ymd(today()) + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  else if (act === 'copyjson') {
    const txt = JSON.stringify({config: state.config, movs: state.movs, cierres: state.cierres});
    try { await navigator.clipboard.writeText(txt); toast('Datos copiados. Pégalos en tu chat con Claude.'); }
    catch(_) { toast('No se pudo copiar. Usa Descargar respaldo.'); }
  }
  else if (act === 'copy') {
    const txt = $('#rep-txt').textContent;
    try { await navigator.clipboard.writeText(txt); toast('Resumen copiado'); }
    catch(_) { const s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents($('#rep-txt')); s.removeAllRanges(); s.addRange(rg); toast('Texto seleccionado: cópialo'); }
  }
});
$('#view').addEventListener('change', e => {
  const el = e.target, act = el.dataset.act; if (!act) return;
  if (act === 'restore') {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then(t => {
      const d = JSON.parse(t); if (!d.config || !Array.isArray(d.movs)) throw 0;
      state.config = d.config; state.movs = d.movs;
      if (Array.isArray(d.cierres)) { state.cierres = d.cierres; LS.set('soles.cierres', state.cierres); }
      saveLocal(); toast('Respaldo restaurado');
    }).catch(() => toast('Ese archivo no es un respaldo de esta app.'));
    return;
  }
  const id = viewCycle(), base = state.scope === 'base';
  // Lo que se cambia a mano queda anotado en "locales" para que una actualización de Claude no lo pise
  if (act === 'monto') {
    const v = num(el.value), p = base ? `base.montos.${el.dataset.k}` : `ciclos.${id}.montos.${el.dataset.k}`;
    write(() => cfgRef().update({...(base ? {base: {montos: {[el.dataset.k]: v}}} : {ciclos: {[id]: {montos: {[el.dataset.k]: v}}}}), locales: {[p]: v}}), 'Monto guardado');
  } else if (act === 'ingreso') {
    const v = num(el.value), p = base ? 'base.ingreso' : `ciclos.${id}.ingreso`;
    write(() => cfgRef().update({...(base ? {base: {ingreso: v}} : {ciclos: {[id]: {ingreso: v}}}), locales: {[p]: v}}), 'Ingreso guardado');
  } else if (act === 'extra') {
    const arr = planFor(id).extras.map(x => ({...x})); arr[+el.dataset.i].monto = num(el.value);
    write(() => cfgRef().update({ciclos: {[id]: {extras: arr}}}), 'Guardado');
  } else if (act === 'pend') {
    const arr = (state.config.pendientes || []).map(x => ({...x})); arr[+el.dataset.i].ok = el.checked;
    write(() => cfgRef().update({pendientes: arr}));
  }
});
$('#view').addEventListener('focusout', () => setTimeout(() => { if (!$('#view').contains(document.activeElement) || document.activeElement.tagName !== 'INPUT') render(); }, 50));

/* ---------- hojas que suben desde abajo ---------- */
// Mientras una hoja está abierta, la pantalla de atrás no se mueve (iPhone ignora overflow:hidden, por eso position:fixed)
let lockY = 0;
function lockScroll(on){
  const b = document.body, anyOpen = !$('#sheet').hidden || !$('#cierre').hidden;
  if (on && !b.classList.contains('locked')) { lockY = window.scrollY; b.style.top = -lockY + 'px'; b.classList.add('locked'); }
  else if (!on && !anyOpen && b.classList.contains('locked')) { b.classList.remove('locked'); b.style.top = ''; window.scrollTo(0, lockY); }
}
function showSheet(id){ const bg = $('#' + id), sh = bg.querySelector('.sheet'); bg.hidden = false; sh.style.transform = ''; sh.scrollTop = 0; lockScroll(true); }
function hideSheet(id){ $('#' + id).hidden = true; lockScroll(false); }
for (const id of ['sheet', 'cierre']) {
  const bg = $('#' + id), sh = bg.querySelector('.sheet');
  let y0 = null, dy = 0;
  // Deslizar hacia abajo cierra la hoja, solo si está arriba del todo
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; sh.style.transition = 'none'; }, {passive: true});
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { sh.style.transform = `translateY(${dy}px)`; if (e.cancelable) e.preventDefault(); }
    else { sh.style.transform = ''; y0 = null; }
  }, {passive: false});
  sh.addEventListener('touchend', () => { sh.style.transition = ''; if (y0 !== null && dy > 90) hideSheet(id); else sh.style.transform = ''; y0 = null; dy = 0; });
  bg.addEventListener('touchmove', e => { if (e.target === bg && e.cancelable) e.preventDefault(); }, {passive: false});
}

/* ---------- registrar gasto ---------- */
function drawChips(){
  $('#f-cats').innerHTML = QUICK.map(k => `<button type="button" data-c="${k}" class="${state.sel.cat === k ? 'on' : ''}">${CATS[k].n}</button>`).join('');
  $('#f-medios').innerHTML = MEDIOS_NUEVOS.map(([k,n]) => `<button type="button" data-m="${k}" class="${isCred(k) ? 'cred ' : ''}${state.sel.medio === k ? 'on' : ''}">${n}</button>`).join('');
  $('#f-warn').innerHTML = isCred(state.sel.medio) ? '<div class="alert bad"><span>La regla es no usar la tarjeta de crédito para gastos del día. Si igual la usaste, regístralo para que no se te escape.</span></div>' : '';
}
function openSheet(){
  if (!state.db || !state.config) { toast('Tus datos aún no cargan.'); return; }
  $('#f-monto').value = ''; $('#f-nota').value = ''; $('#f-fecha').value = ymd(today());
  drawChips(); showSheet('sheet'); setTimeout(() => $('#f-monto').focus(), 60);
}
$('#fab').addEventListener('click', openSheet);
$('#close').addEventListener('click', () => hideSheet('sheet'));
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') hideSheet('sheet'); });
$('#f-cats').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.sel.cat = b.dataset.c; drawChips(); } });
$('#f-medios').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.sel.medio = b.dataset.m; drawChips(); } });
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const monto = num($('#f-monto').value);
  if (monto <= 0) { toast('Escribe cuánto gastaste.'); $('#f-monto').focus(); return; }
  const doc = {tipo: 'gasto', cat: state.sel.cat, monto, medio: state.sel.medio, fecha: $('#f-fecha').value || ymd(today()), nota: $('#f-nota').value.trim().slice(0, 80), creado: Date.now()};
  hideSheet('sheet');
  write(() => state.db.collection('movs').add(doc), `${money(monto)} en ${CATS[doc.cat].n} guardado`);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideSheet('sheet'); hideSheet('cierre'); } });

/* ---------- finalizar día ---------- */
function openCierre(fecha){
  if (!state.db || !state.config) { toast('Tus datos aún no cargan.'); return; }
  const hoyStr = ymd(today()), t = fecha && fecha <= hoyStr ? fecha : hoyStr, esHoy = t === hoyStr;
  state.cierreFecha = t;
  const dia = esHoy ? 'hoy' : 'el ' + longD(parseD(t));
  const hoy = state.movs.filter(m => m.tipo === 'gasto' && m.fecha === t).sort((a,b) => (a.creado||0) - (b.creado||0));
  const prev = state.cierres.find(x => x.fecha === t) || [...state.cierres].filter(x => x.fecha < t).sort((a,b) => a.fecha < b.fecha ? 1 : -1)[0] || lastCierre();
  const s = (prev && prev.saldos) || {}, L = lineas();
  const medioSel = m => `<select id="cm-${esc(m.id)}" data-id="${esc(m.id)}" aria-label="De dónde salió" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:160px">
      ${(MEDIOS_NUEVOS.some(x => x[0] === m.medio) ? MEDIOS_NUEVOS : MEDIOS).map(([k,n]) => `<option value="${k}" ${m.medio === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  $('#cierre-body').innerHTML = `
    <div class="field"><span class="label">¿Qué día cierras?</span>
      <div class="daychips">${[...Array(7)].map((_, i) => { const d = addDays(today(), -i), f = ymd(d), ok = state.cierres.some(x => x.fecha === f); return `<button type="button" data-cf="${f}" class="${f === t ? 'on' : ''}">${dayLabel(d)}<small>${ok ? 'cerrado ✓' : d.getDate() + ' ' + MESES[d.getMonth()].slice(0,3)}</small></button>`; }).join('')}</div>
      <label class="line"><span>Otra fecha</span><input type="date" id="ci-fecha" value="${t}" max="${hoyStr}" style="width:auto"></label></div>
    <div class="meta-big"><b class="num">${money(sum(hoy))}</b><span>${hoy.length ? 'gastaste ' + dia + ' en ' + hoy.length + (hoy.length === 1 ? ' gasto' : ' gastos') : 'no registraste gastos ' + dia}</span></div>
    ${hoy.length ? `<div class="field"><span class="label">¿De dónde salió cada gasto?</span>
      ${hoy.map(m => `<div class="row2" style="border-top:1px solid var(--line);padding-top:8px"><span>${esc(CATS[m.cat]?.n || m.cat)}<br><small class="sub num">${money(m.monto)}${m.nota ? ' · ' + esc(m.nota) : ''}</small></span>${medioSel(m)}</div>`).join('')}</div>` : ''}
    <button type="button" class="btn ghost" id="cierre-add">Me olvidé de anotar un gasto</button>
    <div class="field"><span class="label">¿Cuánto te quedó ${esHoy ? 'ahora' : 'ese día'}?</span>
      <div class="sub">Mira cada app y escribe el saldo. En las tarjetas, escribe el <b>disponible</b>.</div>
      ${CUENTAS.map(x => `<label class="line"><span>${x.n}<small>${x.tipo === 'tc' ? 'Disponible de una línea de ' + money0(L[x.k]) : x.h}</small></span>
        <input id="ci-${x.k}" inputmode="decimal" placeholder="0.00" value="${s[x.k] !== undefined && s[x.k] !== '' ? (+s[x.k]).toFixed(2) : ''}"></label>`).join('')}
      ${prev && prev.fecha !== t ? `<div class="sub">Te dejé los saldos del cierre del ${short(parseD(prev.fecha))}. Cámbialos si se movieron.</div>` : ''}
    </div>`;
  showSheet('cierre');
}
$('#cierre-close').addEventListener('click', () => hideSheet('cierre'));
$('#cierre').addEventListener('click', e => {
  if (e.target.id === 'cierre') hideSheet('cierre');
  const cf = e.target.closest('[data-cf]'); if (cf) openCierre(cf.dataset.cf);
  if (e.target.id === 'cierre-add') { hideSheet('cierre'); openSheet(); if (state.cierreFecha) $('#f-fecha').value = state.cierreFecha; }
});
$('#cierre').addEventListener('change', e => { if (e.target.id === 'ci-fecha' && e.target.value) openCierre(e.target.value); });
$('#cierre-form').addEventListener('submit', async e => {
  e.preventDefault();
  const t = state.cierreFecha || ymd(today());
  // Corrige de dónde salió cada gasto
  for (const sel of document.querySelectorAll('#cierre-body select[data-id]')) {
    const m = state.movs.find(x => x.id === sel.dataset.id);
    if (m && m.medio !== sel.value) { const {id, ...rest} = m; await write(() => state.db.collection('movs').doc(id).set({...rest, medio: sel.value})); }
  }
  const saldos = {};
  for (const x of CUENTAS) { const v = $('#ci-' + x.k).value.trim(); if (v !== '') saldos[x.k] = num(v); }
  const hoy = state.movs.filter(m => m.tipo === 'gasto' && m.fecha === t);
  const cierre = {fecha: t, saldos, gastoHoy: sum(hoy), creado: Date.now()};
  state.cierres = state.cierres.filter(x => x.fecha !== t).concat(cierre).sort((a,b) => a.fecha < b.fecha ? -1 : 1).slice(-400);
  if (!LS.set('soles.cierres', state.cierres)) { toast('No se pudo guardar el cierre.'); return; }
  hideSheet('cierre');
  state.view = 'hoy'; render(); window.scrollTo(0, 0);
  toast(t === ymd(today()) ? 'Día cerrado. Buen trabajo 💪' : 'Cerraste el ' + longD(parseD(t)));
});

/* ---------- guardado en este celular ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }
};
function deepMerge(t, s) {
  for (const k in s) {
    const v = s[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) { if (!t[k] || typeof t[k] !== 'object' || Array.isArray(t[k])) t[k] = {}; deepMerge(t[k], v); }
    else t[k] = v;
  }
  return t;
}
function saveLocal() {
  if (!(LS.set('soles.config', state.config) && LS.set('soles.movs', state.movs))) throw {code: 'storage'};
  render();
}
const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const localDb = {
  doc: () => ({
    update: async d => { state.config = deepMerge(JSON.parse(JSON.stringify(state.config || {})), d); saveLocal(); },
    set: async d => { state.config = d; saveLocal(); }
  }),
  collection: () => ({
    doc: id => ({
      set: async d => { state.movs = state.movs.filter(m => m.id !== id).concat({id, ...d}); saveLocal(); },
      delete: async () => { state.movs = state.movs.filter(m => m.id !== id); saveLocal(); }
    }),
    add: async d => { state.movs = state.movs.concat({id: newId(), ...d}); saveLocal(); }
  })
};

const b64urlToBytes = s => { const b = s.replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(b + '==='.slice((b.length + 3) % 4)), c => c.charCodeAt(0)); };

// Aplica un plan nuevo conservando lo que la persona anotó: liquidación/gratificación y datos ya confirmados
function applyConfig(cfg) {
  if (!cfg || !cfg.base || !cfg.base.montos) return false;
  const old = state.config;
  if (old) {
    for (const id in (old.ciclos || {})) {
      const oe = old.ciclos[id].extras || [], ne = cfg.ciclos && cfg.ciclos[id] && cfg.ciclos[id].extras;
      if (ne) for (const e of ne) { const o = oe.find(x => x.n === e.n); if (o && +o.monto && !+e.monto) e.monto = o.monto; }
    }
    const okT = new Set((old.pendientes || []).filter(p => p.ok).map(p => p.t));
    for (const p of (cfg.pendientes || [])) if (okT.has(p.t)) p.ok = true;
    if (old.locales && !cfg.borrarLocales) {
      for (const [p, v] of Object.entries(old.locales)) {
        const ks = p.split('.'); let o = cfg;
        for (const k of ks.slice(0, -1)) { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
        o[ks[ks.length - 1]] = v;
      }
      cfg.locales = {...old.locales};
    }
  }
  delete cfg.borrarLocales;
  state.config = cfg;
  LS.set('soles.config', state.config);
  return true;
}

// El plan vive cifrado en plan.enc.json; solo este celular tiene la llave. La app lo baja sola al abrirse.
let syncing = null;
function syncRemote() {
  if (syncing) return syncing;
  syncing = (async () => {
    const k = LS.get('soles.key', null);
    if (!k || !window.crypto || !crypto.subtle) return false;
    try {
      const r = await fetch('plan.enc.json?t=' + Date.now(), {cache: 'no-store'});
      if (!r.ok) return false;
      const enc = await r.json();
      if (state.config && +enc.v <= +LS.get('soles.planv', 0)) return false;
      const key = await crypto.subtle.importKey('raw', b64urlToBytes(k), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64urlToBytes(enc.iv)}, key, b64urlToBytes(enc.data));
      if (!applyConfig(JSON.parse(new TextDecoder().decode(plain)))) return false;
      LS.set('soles.planv', +enc.v);
      render();
      return true;
    } catch(e) { return false; }
  })().finally(() => { syncing = null; });
  return syncing;
}

// Acepta el link de conexión (#k=…) o un link de plan (#plan=…), aunque venga cortado en varias líneas
async function loadFromText(text) {
  const s = String(text || '');
  const ki = s.indexOf('k=');
  if (ki >= 0 && s.indexOf('plan=') < 0) {
    const k = s.slice(ki + 2).replace(/[^A-Za-z0-9_-]/g, '');
    if (k.length < 40) return false;
    const prevK = LS.get('soles.key', null), prevV = LS.get('soles.planv', 0);
    LS.set('soles.key', k); LS.set('soles.planv', 0);
    const ok = await syncRemote();
    if (!ok) { LS.set('soles.key', prevK); LS.set('soles.planv', prevV); }
    return ok;
  }
  try {
    const i = s.indexOf('plan=');
    const b64 = (i >= 0 ? s.slice(i + 5) : s).replace(/[^A-Za-z0-9_-]/g, '');
    if (b64.length < 20) return false;
    return applyConfig(JSON.parse(new TextDecoder().decode(b64urlToBytes(b64))));
  } catch(e) { return false; }
}
function pastePlanHTML(id) {
  return `<div class="field" style="text-align:left"><span class="label">Pega aquí el link que te mandó Claude</span>
    <textarea id="${id}" rows="3" placeholder="https://sguzmanfigueroa.github.io/soles-de-sebas/#k=…" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;font:inherit;font-size:13px"></textarea>
    <button class="btn" data-act="loadcfg" data-src="${id}">Conectar</button></div>`;
}

$('#view').addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') state.pasteBuf = e.target.value; });

// Si hay una versión nueva publicada, recarga la app (el iPhone guarda la página vieja en caché)
const APP_VERSION = '1793049350110';
async function checkUpdate(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const v = String((await r.json()).v);
    if (v === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem('soles.upd'); } catch(e) {}
    if (tried === v) return;
    try { sessionStorage.setItem('soles.upd', v); } catch(e) {}
    location.replace(location.pathname + '?v=' + v);
  } catch(e) {}
}

/* ---------- arranque ---------- */
(function boot() {
  let ok = true;
  try { localStorage.setItem('soles.test', '1'); localStorage.removeItem('soles.test'); } catch(e) { ok = false; }
  state.db = ok ? localDb : null;
  state.config = LS.get('soles.config', null);
  state.movs = LS.get('soles.movs', []);
  state.cierres = LS.get('soles.cierres', []);
  state.loadedCfg = state.loadedMovs = true;
  if (ok && /(^|[#&])(k|plan)=/.test(location.hash)) {
    const h = location.hash;
    history.replaceState(null, '', location.pathname);
    loadFromText(h).then(r => { toast(r ? 'Listo: tu plan quedó conectado' : 'El link está incompleto. Cópialo otra vez entero.'); render(); });
  } else if (ok) {
    checkUpdate(); syncRemote().then(r => { if (r) toast('Claude actualizó tu plan'); });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkUpdate(); syncRemote().then(r => { if (r) toast('Claude actualizó tu plan'); }); }
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  render();
})();
</script>
